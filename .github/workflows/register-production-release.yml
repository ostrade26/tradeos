# After production deploy, auto-create a draft platform release from git commits (no manual typing).
# Requires repo secrets: TRADEAL_API_URL, TRADEAL_API_TOKEN
# (same token as Railway env TRADEAL_API_TOKEN / header x-tradeal-token).
name: Register production release

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  register-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register deploy draft + notify platform admins
        env:
          TRADEAL_API_URL: ${{ secrets.TRADEAL_API_URL }}
          TRADEAL_API_TOKEN: ${{ secrets.TRADEAL_API_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          TRADEAL_DEPLOY_ENV: production
        run: |
          if [[ -z "${TRADEAL_API_URL}" || -z "${TRADEAL_API_TOKEN}" ]]; then
            echo "::warning::Skipping deploy notify — set repository secrets TRADEAL_API_URL and TRADEAL_API_TOKEN."
            echo "TRADEAL_API_URL = production API origin (e.g. https://your-api.up.railway.app)"
            echo "TRADEAL_API_TOKEN = same value as Railway TRADEAL_API_TOKEN (sent as x-tradeal-token)."
            echo "Once set, pushes to main create a Releases draft and notify Tradeal admins."
            exit 0
          fi
          chmod +x scripts/register-production-deploy.sh
          ./scripts/register-production-deploy.sh
